name: Rebuild KSAS unique area ranking
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/build_unique_coverage.py'
      - '.github/workflows/ksas-unique-ranking.yml'
      - 'data/KSAS_RSN2035_101_Dashboard.geojson'
permissions:
  contents: write
jobs:
  spatial-analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install GEOS-based spatial dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "geopandas>=1.0,<2" "shapely>=2.1,<3" pyproj pyogrio
      - name: Download original SUO PBT and district GeoJSON
        run: |
          mkdir -p build
          curl --fail --location --retry 3 --silent --show-error \
            "https://raw.githubusercontent.com/SelangorUrbanObservatory/3D-Geoportal/main/data/pentadbiran/sempadan_pbt_selangor_2024.geojson" \
            -o build/pbt.geojson
          curl --fail --location --retry 3 --silent --show-error \
            "https://raw.githubusercontent.com/SelangorUrbanObservatory/3D-Geoportal/main/data/pentadbiran/sempadan_daerah_selangor.geojson" \
            -o build/daerah.geojson
      - name: Detect active KSAS source and calculate all unique coverages
        run: |
          python - <<'PY'
          import json, subprocess
          from pathlib import Path
          data=Path('data/KSAS_RSN2035_101_Dashboard.geojson')
          is_primary=False
          if data.exists() and data.stat().st_size:
              try:
                  j=json.loads(data.read_text(encoding='utf-8'))
                  is_primary=j.get('type')=='FeatureCollection' and len(j.get('features',[]))==101
              except Exception as e:
                  print('Primary GeoJSON invalid:',e)
          args=['python','scripts/build_unique_coverage.py','--pbt','build/pbt.geojson','--daerah','build/daerah.geojson','--output','data/ksas_admin_unique.json']
          if not is_primary:
              print('Primary 101 absent; computing archive source explicitly')
              args+=['--ksas-mode','archive','--archive-dir','data']
          subprocess.run(args,check=True)
          result=json.loads(Path('data/ksas_admin_unique.json').read_text(encoding='utf-8'))
          assert len(result['pbt'])==12 and len(result['daerah'])==9
          assert result['metric']=='union_clipped_geometries_ha'
          print('Computed',result['source_dataset'],'source count',result['source_count'])
          PY
      - name: Commit computed ranking dataset
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ksas_admin_unique.json
          if git diff --cached --quiet; then
            echo "No new GIS ranking data"
          else
            git commit -m "data: recompute KSAS unique coverage across PBT and districts"
            git push
          fi
